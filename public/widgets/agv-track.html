<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGV 工位轨道</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:#1D1D1F}
.wrap{position:relative;width:100%;height:100%;padding:0 4%}
.rail{position:absolute;left:8%;right:8%;top:34%;height:8px;border-radius:3px;background:rgba(60,60,67,.14)}
.fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#0A84FF,#64D2FF);box-shadow:0 0 14px rgba(10,132,255,.55);transition:width 1.6s cubic-bezier(.4,0,.2,1)}
.st{position:absolute;top:34%;width:0;height:0}
.dot{position:absolute;left:-14px;top:-10px;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid rgba(60,60,67,.25);transition:all .5s}
.st.on .dot{border-color:#0A84FF;box-shadow:0 0 0 6px rgba(10,132,255,.16)}
.name{position:absolute;left:-60px;width:120px;top:34px;text-align:center;font-size:21px;font-weight:600}
.pills{position:absolute;left:-60px;width:120px;top:74px;display:flex;justify-content:center;gap:6px}
.pill{font-size:13px;padding:4px 11px;border-radius:99px;background:rgba(60,60,67,.09);color:rgba(60,60,67,.6);font-weight:600;transition:all .4s;white-space:nowrap}
.pill.on{background:rgba(48,209,88,.16);color:#1E9E42}
.pill.run{background:rgba(10,132,255,.14);color:#0A6FE0}
.moma{z-index:3;position:absolute;top:calc(34% + 4px);width:0;height:0;transition:left 1.6s cubic-bezier(.4,0,.2,1)}
.moma i{position:absolute;left:-25px;top:-25px;width:50px;height:50px;border-radius:15px;background:linear-gradient(145deg,#0A84FF,#5E5CE6);box-shadow:0 8px 22px rgba(10,132,255,.45),inset 0 1px 0 rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;letter-spacing:.5px}
.moma i::after{content:"";position:absolute;inset:-8px;border-radius:18px;border:2px solid rgba(10,132,255,.35);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.tag{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-family:"SF Mono",Consolas,monospace;font-size:12px;color:rgba(60,60,67,.5);letter-spacing:.4px}
</style>
</head>
<body>
<div class="wrap" id="w">
  <div class="rail"><div class="fill" id="fill"></div></div>
  <div class="moma" id="moma"><i>MOMA</i></div>
  <div class="tag">Q2.0–Q2.3 启动 · I2.0–I2.3 到达</div>
</div>
<script>
var S=[
  {k:'wuliu',n:'物流',q:'Q2.2',i:'I2.2'},
  {k:'zhuangpei',n:'装配',q:'Q2.0',i:'I2.1'},
  {k:'jiance',n:'检测',q:'Q2.1',i:'I2.0'},
  {k:'chongdian',n:'充电',q:'Q2.3',i:'I2.3'}
];
var q=new URLSearchParams(location.search);
var cur=Math.max(0,S.findIndex(function(s){return s.k===q.get('station')}));
if(cur<0)cur=0;
var demo=q.get('demo')!=='0';
var w=document.getElementById('w'),fill=document.getElementById('fill'),moma=document.getElementById('moma');
var els=S.map(function(s,idx){
  var d=document.createElement('div');d.className='st';d.style.left=(8+idx*(84/3))+'%';
  d.innerHTML='<div class="dot"></div><div class="name">'+s.n+'</div><div class="pills"><span class="pill">启动</span><span class="pill">到达</span></div>';
  w.appendChild(d);return d;
});
function pos(i){return 8+i*(84/3)}
function render(){
  moma.style.left=pos(cur)+'%';
  fill.style.width=(cur/3*100)+'%';
  els.forEach(function(d,i){
    var p=d.querySelectorAll('.pill');
    d.classList.toggle('on',i===cur);
    p[0].className='pill'+(i===cur?' run':'');
    p[1].className='pill'+(i===cur?' on':'');
  });
}
function go(k){var i=S.findIndex(function(s){return s.k===k});if(i>=0){cur=i;render()}}
window.addEventListener('message',function(e){if(e.data&&e.data.station)go(e.data.station)});
render();
if(demo)setInterval(function(){cur=(cur+1)%4;render()},3200);
</script>
</body>
</html>
