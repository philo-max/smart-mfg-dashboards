<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工位启动信号</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:#1D1D1F}
.list{height:100%;display:flex;flex-direction:column;justify-content:space-around;padding:0 3%}
.row{display:flex;align-items:center;justify-content:space-between;padding:0 2%;border-bottom:1px solid rgba(60,60,67,.1);flex:1;min-height:0}
.row:last-child{border-bottom:0}
.l{display:flex;align-items:baseline;gap:12px}
.l b{display:block;font-size:17px;line-height:1.15;font-weight:600}
.l small{font-family:"SF Mono",Consolas,monospace;font-size:11px;line-height:1.1;color:rgba(60,60,67,.5)}
.sw{--h:26px;--w:calc(var(--h)*1.68);position:relative;flex:none;width:var(--w);height:var(--h);border-radius:99px;background:rgba(120,120,128,.24);cursor:pointer;transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:calc(var(--h) - 6px);height:calc(var(--h) - 6px);border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:#30D158}
.sw.on::after{transform:translateX(calc(var(--w) - var(--h)))}
</style>
</head>
<body>
<div class="list" id="l"></div>
<script>
var S=[
  {k:'ZhuangPei',n:'装配工位',a:'ZhuangPei_startsignal · Q2.0',v:0},
  {k:'JianCe',n:'检测工位',a:'JianCe_startsignal · Q2.1',v:1},
  {k:'WuLiu',n:'物流工位',a:'WuLiu_startsignal · Q2.2',v:0},
  {k:'ChongDian',n:'充电工位',a:'ChongDian_startsignal · Q2.3',v:0}
];
var q=new URLSearchParams(location.search);
S.forEach(function(s){var p=q.get(s.k);if(p!==null)s.v=p==='1'?1:0});
var l=document.getElementById('l');
S.forEach(function(s){
  var r=document.createElement('div');r.className='row';
  r.innerHTML='<div class="l"><b>'+s.n+'</b><small>'+s.a+'</small></div><div class="sw'+(s.v?' on':'')+'"></div>';
  r.querySelector('.sw').onclick=function(){s.v=s.v?0:1;this.classList.toggle('on',!!s.v)};
  s.el=r.querySelector('.sw');
  l.appendChild(r);
});
window.addEventListener('message',function(e){
  var d=e.data||{};
  S.forEach(function(s){if(d[s.k]!==undefined){s.v=d[s.k]?1:0;s.el.classList.toggle('on',!!s.v)}});
});
</script>
</body>
</html>
